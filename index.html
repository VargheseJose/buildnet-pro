<style>
  :root {
    color-scheme: dark;
  }
  
  body {
    background-color: #020617;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    scroll-behavior: smooth;
    overflow-x: hidden;
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #020617;
  }
  ::-webkit-scrollbar-thumb {
    background: #1e293b;
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #334155;
  }
  
  /* Modern Animations */
  @keyframes slide-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-slide-up {
    animation: slide-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .shimmer-bg {
    background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.1), transparent);
    background-size: 200% 100%;
    animation: shimmer 2s infinite;
  }
  
  /* Input & Button Refinement */
  input, select, textarea {
    font-size: 16px !important; /* Prevents auto-zoom on iOS */
  }

  /* Prose Table Refinement */
  .prose table {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    border: 1px solid #1e293b;
    border-radius: 0.75rem;
    overflow: hidden;
  }
  .prose th { background: #0f172a; padding: 1rem !important; }
  .prose td { padding: 1rem !important; border-top: 1px solid #1e293b; }

  @media print {
    @page {
      size: A4;
      margin: 1cm 1.5cm;
    }
    .no-print { display: none !important; }
    body { background: white !important; color: black !important; padding: 0 !important; margin: 0 !important; }
    #root main { padding: 0 !important; margin: 0 !important; }
    .max-w-6xl { max-width: 100% !important; width: 100% !important; margin: 0 !important; }
    
    /* Force high contrast and hide dark-mode backgrounds */
    .bg-[#0a0f1c], .bg-slate-900, .bg-slate-950, .bg-[#020617] { 
        background: white !important; 
        box-shadow: none !important; 
        border-color: #eee !important;
    }
    
    .text-white, .text-slate-200, .text-slate-300 { color: black !important; }
    .text-slate-500, .text-slate-400 { color: #666 !important; }
    .text-emerald-400, .text-emerald-500 { color: #059669 !important; }
    
    /* Ensure markdown content looks like a formal document */
    .prose { 
        color: black !important; 
        max-width: 100% !important; 
        font-size: 11pt !important;
        line-height: 1.5 !important;
    }
    .prose h1, .prose h2, .prose h3 { color: black !important; margin-top: 1.5em !important; }
    .prose table { border: 1pt solid #000 !important; border-collapse: collapse !important; width: 100% !important; }
    .prose th { background: white !important; }
    .prose th, .prose td { border: 0.5pt solid #000 !important; padding: 6pt !important; color: black !important; }
    .prose thead { display: table-header-group; }
    
    /* Page break optimization */
    h1, h2, h3 { page-break-after: avoid; }
    table, figure { page-break-inside: avoid; }
    
    /* Logo in print */
    .print-logo { display: block !important; width: 100px; margin-bottom: 20px; }
  }
