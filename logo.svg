<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'>
  <defs>
    <filter id='glow' x='-30%' y='-30%' width='160%' height='160%'>
      <feGaussianBlur stdDeviation='6' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
  </defs>
  <g transform='translate(200, 200)'>
    <!-- Hexagon Frame -->
    <path d='M0 -130 L112 -65 L112 65 L0 130 L-112 65 L-112 -65 Z' fill='none' stroke='#00e5ff' stroke-width='8' filter='url(#glow)'/>
    
    <!-- Internal Network Lines -->
    <g stroke='#00e5ff' stroke-width='5' opacity='0.7'>
      <!-- Vertical and Horizontal Main Paths -->
      <line x1='0' y1='-130' x2='0' y2='-65' />
      <line x1='0' y1='130' x2='0' y2='65' />
      <line x1='-112' y1='-65' x2='-56' y2='0' />
      <line x1='-112' y1='65' x2='-56' y2='0' />
      <line x1='112' y1='-65' x2='56' y2='0' />
      <line x1='112' y1='65' x2='56' y2='0' />
      
      <!-- Diamond Inner Connections -->
      <line x1='0' y1='-65' x2='56' y2='0' />
      <line x1='56' y1='0' x2='0' y2='65' />
      <line x1='0' y1='65' x2='-56' y2='0' />
      <line x1='-56' y1='0' x2='0' y2='-65' />
    </g>

    <!-- 6 Outer Glowing Nodes -->
    <g fill='#00e5ff' filter='url(#glow)'>
      <circle cx='0' cy='-130' r='12'/>
      <circle cx='112' cy='-65' r='12'/>
      <circle cx='112' cy='65' r='12'/>
      <circle cx='0' cy='130' r='12'/>
      <circle cx='-112' cy='65' r='12'/>
      <circle cx='-112' cy='-65' r='12'/>
    </g>

    <!-- 4 Inner Glowing Nodes -->
    <g fill='#00e5ff' filter='url(#glow)'>
      <circle cx='0' cy='-65' r='12'/>
      <circle cx='0' cy='65' r='12'/>
      <circle cx='56' cy='0' r='12'/>
      <circle cx='-56' cy='0' r='12'/>
    </g>
  </g>
</svg>